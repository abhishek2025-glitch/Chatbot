name: Deploy Aria Demo to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build website with injected GitHub Secrets
        env:
          # =========================================================================
          # GITHUB SECRET PLACEHOLDER FOR GROQ API KEY:
          # 1. In GitHub, go to: Settings -> Secrets and variables -> Actions
          # 2. Click "New repository secret"
          # 3. Name: GROQ_API_KEY
          # 4. Value: your Groq API key (starts with 'gsk_...')
          # =========================================================================
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_WORKER_URL: ${{ secrets.WORKER_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
